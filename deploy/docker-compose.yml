# 전 스택 기동 (M2.5 수용 기준 5):  docker compose -f deploy/docker-compose.yml up -d --build
# 인프라만 (로컬 gradle 개발 시):   docker compose -f deploy/docker-compose.yml up -d redis postgres
# 비밀키는 저장소 루트 .env (GEMINI_API_KEY) — 커밋되지 않는다.
services:
  redis:
    image: redis:7-alpine
    container_name: sjw-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: sjw-postgres
    environment:
      POSTGRES_DB: sjw
      POSTGRES_USER: sjw
      POSTGRES_PASSWORD: sjw
    ports:
      - "5433:5432"   # 로컬 postgresql@17(5432)과 충돌 방지
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sjw -d sjw"]
      interval: 5s
      timeout: 3s
      retries: 5

  ner:
    build:
      context: ..
      dockerfile: deploy/ner.Dockerfile
    container_name: sjw-ner
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    container_name: sjw-api
    env_file: ../.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sjw
      SPRING_DATA_REDIS_HOST: redis
      NER_URL: http://ner:8100
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ner:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    container_name: sjw-worker
    env_file: ../.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sjw
      SPRING_DATA_REDIS_HOST: redis
      NER_URL: http://ner:8100
    ports:
      - "8081:8081"
    depends_on:
      api:                       # 스키마는 api의 Flyway가 관리 (ADR-023) — api 기동 후에 뜬다
        condition: service_healthy
      ner:
        condition: service_healthy

volumes:
  pgdata:
