# 공개 진입점 뒤의 api. 앱 포트(8080)만 Service로 연다 — 관리 포트(9080: actuator)는 probe와 클러스터 내부용.
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: harbor-cred
      containers:
        - name: api
          image: sjw-api
          envFrom:
            - configMapRef: { name: sjw-config }
          env:
            - name: GEMINI_API_KEY          # 운영자 키 — operator_access 테넌트의 비동기·배치 전용
              valueFrom:
                secretKeyRef: { name: sjw-secrets, key: GEMINI_API_KEY }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: sjw-secrets, key: POSTGRES_PASSWORD }
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: sjw-secrets, key: REDIS_PASSWORD }
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9080
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 5
            failureThreshold: 36   # Flyway 마이그레이션 + KB 로드 — 최대 3분
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
