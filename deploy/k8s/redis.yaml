# 캐시 + 작업 큐(Streams). 큐가 들어 있으므로 AOF로 디스크에 남긴다 — 재시작에 미ACK 메시지를 잃으면
# PENDING job이 고아가 된다. 비밀번호 필수(compose와 다름 — 공유 클러스터다).
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--requirepass", "$(REDIS_PASSWORD)", "--appendonly", "yes", "--maxmemory", "200mb",
                 "--maxmemory-policy", "volatile-lru"]   # TTL 있는 키(캐시·일일 카운터)만 축출 — TTL 없는 큐(Streams)는 안전
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: sjw-secrets, key: REDIS_PASSWORD }
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ebs-sc
        resources:
          requests:
            storage: 1Gi
