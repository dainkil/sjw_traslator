spring:
  application:
    name: sjw-api
  datasource:
    url: jdbc:postgresql://localhost:5433/sjw
    username: sjw
    password: sjw
  flyway:
    # 스키마는 Flyway 마이그레이션(db/migration/)으로만 변경한다 (ADR-023).
    # V1 이전 방식(schema.sql 직접 실행)으로 만들어진 기존 DB는 버전 1로 기준선 처리.
    baseline-on-migrate: true
  ai:
    google:
      genai:
        # Developer API 모드: api-key만 설정한다.
        # 주의(§4.3): project-id / location을 설정하면 Vertex AI 모드로 전환되어
        # Developer API 키가 400으로 거부된다. 절대 추가하지 말 것.
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            # 기본 옵션일 뿐, 실제 모델은 Translator가 호출마다 레지스트리 값으로 지정한다.
            model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
            temperature: 0.2

sjw:
  llm:
    # 모델 레지스트리 (M2.5) — rate 버킷 키·원장 단가·M4 티어 매핑의 단일 출처.
    # 모델 교체는 이 파일 또는 GEMINI_MODEL 환경변수로만 한다 (수용 기준 3: 코드 수정 0줄).
    active-model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
    usd-krw: 1400                       # (추정) cost-model.md와 동일 파라미터
    models:
      - id: gemini-3.5-flash
        provider: google-genai
        tier: T1
        rpd: 20                         # 실측 (docs/benchmarks.md, PerDayPerProjectPerModel)
        unit-price-in-usd-per-mtok: 0.30   # counterfactual — 2.5 Flash 공시가를 proxy로 사용 (추정)
        unit-price-out-usd-per-mtok: 2.50
      - id: gemini-3.1-flash-lite
        provider: google-genai
        tier: T0
        unit-price-in-usd-per-mtok: 0.10   # counterfactual — 2.5 Flash-Lite 공시가 proxy (추정)
        unit-price-out-usd-per-mtok: 0.40
      - id: gemma-4-26b-a4b-it
        provider: google-genai
        tier: T0
        unit-price-in-usd-per-mtok: 0      # 유료 제공 없음 — counterfactual 0
        unit-price-out-usd-per-mtok: 0
  ner:
    url: ${NER_URL:http://localhost:8100}
  kb:
    dir: ${KB_DIR:../kb}
    version: injo-v1

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
