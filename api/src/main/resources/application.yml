spring:
  application:
    name: sjw-api
  datasource:
    url: jdbc:postgresql://localhost:5433/sjw
    username: sjw
    password: sjw
  flyway:
    # 스키마는 Flyway 마이그레이션(db/migration/)으로만 변경한다 (ADR-023).
    # V1 이전 방식(schema.sql 직접 실행)으로 만들어진 기존 DB는 버전 1로 기준선 처리.
    baseline-on-migrate: true
  ai:
    google:
      genai:
        # Developer API 모드: api-key만 설정한다.
        # 주의(§4.3): project-id / location을 설정하면 Vertex AI 모드로 전환되어
        # Developer API 키가 400으로 거부된다. 절대 추가하지 말 것.
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            # 기본 옵션일 뿐, 실제 모델은 Translator가 호출마다 레지스트리 값으로 지정한다.
            model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
            temperature: 0.2

sjw:
  llm:
    # 모델 레지스트리 (M2.5) — rate 버킷 키·원장 단가·M4 티어 매핑의 단일 출처.
    # 모델 교체는 이 파일 또는 GEMINI_MODEL 환경변수로만 한다 (수용 기준 3: 코드 수정 0줄).
    active-model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
    usd-krw: 1400                       # (추정) cost-model.md와 동일 파라미터
    models:
      - id: gemini-3.5-flash
        provider: google-genai
        tier: T1
        rpd: 20                         # 실측 (docs/benchmarks.md, PerDayPerProjectPerModel)
        unit-price-in-usd-per-mtok: 0.30   # counterfactual — 2.5 Flash 공시가를 proxy로 사용 (추정)
        unit-price-out-usd-per-mtok: 2.50
      - id: gemini-3.1-flash-lite
        provider: google-genai
        tier: T0
        unit-price-in-usd-per-mtok: 0.10   # counterfactual — 2.5 Flash-Lite 공시가 proxy (추정)
        unit-price-out-usd-per-mtok: 0.40
      - id: gemma-4-26b-a4b-it
        provider: google-genai
        tier: T0
        unit-price-in-usd-per-mtok: 0      # 유료 제공 없음 — counterfactual 0
        unit-price-out-usd-per-mtok: 0
  cache:
    # M3 L1 캐시 (ADR-009). 키에는 kb_version·prompt_version·ner_version이 들어가므로
    # 인물 사전 교체·프롬프트 개정·NER 재학습은 저절로 무효화된다 (체크섬 파생).
    # epoch는 그 자동화가 닿지 않는 축, 곧 번역 LLM 교체용 수동 손잡이다 — 모델을 갈아끼우고
    # 캐시를 전면 재구축하려면 이 값을 올린다.
    epoch: ${CACHE_EPOCH:1}
    l1:
      enabled: ${CACHE_L1_ENABLED:true}
      ttl-days: 30      # 정확성 장치가 아니라 메모리 위생 — 옛 버전 고아 엔트리 회수용
    l2:
      # 템플릿 슬롯 캐시 (M3-S3). **기본 off, 명시 opt-in** — 품질을 깎아 비용을 버는 기능이므로
      # 기본값이 되어선 안 된다(계획서 §10 M3). §5.4 비열등 임계(chrF −2.0, 확정 인명 재현율
      # 하락 0)를 M3-S5에서 통과해야 켠다. 히트 결과의 등급은 항상 DEGRADED(ADR-009).
      # 꺼져 있어도 job.template_hash는 기록된다 — S4 히트율 시뮬레이션의 입력이다.
      enabled: ${CACHE_L2_ENABLED:false}
      ttl-days: 30
  ner:
    url: ${NER_URL:http://localhost:8100}
    mode: ${NER_MODE:http}   # http(ONNX 서버, 운영) | rule(규칙 축소판 — degrade/A/B)
  kb:
    mode: ${KB_MODE:file}   # file(왕대별 데이터) | noop(무주입 대조군·degrade)
    dir: ${KB_DIR:../kb}
    name: ${KB_NAME:injo}   # id_lookup_{name}.json / inverted_index_{name}.json — injo, jeongjo 커밋됨
    # version은 설정이 아니다 — 데이터 파일 체크섬에서 파생된다 (M3 캐시 무효화의 신뢰 근거)

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
