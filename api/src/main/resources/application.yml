spring:
  application:
    name: sjw-api
  datasource:
    url: jdbc:postgresql://localhost:5433/sjw
    username: sjw
    password: sjw
  flyway:
    # 스키마는 Flyway 마이그레이션(db/migration/)으로만 변경한다 (ADR-023).
    # V1 이전 방식(schema.sql 직접 실행)으로 만들어진 기존 DB는 버전 1로 기준선 처리.
    baseline-on-migrate: true
  ai:
    google:
      genai:
        # Developer API 모드: api-key만 설정한다.
        # 주의(§4.3): project-id / location을 설정하면 Vertex AI 모드로 전환되어
        # Developer API 키가 400으로 거부된다. 절대 추가하지 말 것.
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            # 무료 티어 운영(ADR-016): 실제 모델은 GEMINI_MODEL 환경변수로 주입
            model: ${GEMINI_MODEL:gemini-2.5-flash}
            temperature: 0.2

sjw:
  ner:
    url: ${NER_URL:http://localhost:8100}
  kb:
    dir: ${KB_DIR:../kb}
    version: injo-v1

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
