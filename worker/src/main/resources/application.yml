spring:
  application:
    name: sjw-worker
  ai:
    retry:
      max-attempts: 1   # 내장 재시도 비활성 — 재시도 정책은 Resilience4j가 단독 통제 (이중 재시도 방지)
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
            temperature: 0.2
  datasource:
    url: jdbc:postgresql://localhost:5433/sjw
    username: sjw
    password: sjw
  sql:
    init:
      mode: never   # 스키마는 api의 Flyway가 관리 (api/src/main/resources/db/migration/, ADR-023)

server:
  port: 8081

sjw:
  llm:
    # 모델 레지스트리 (M2.5) — api와 동일 블록. rate 버킷 키(모델별)·원장 단가의 단일 출처.
    active-model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
    usd-krw: 1400                       # (추정) cost-model.md와 동일 파라미터
    models:
      - id: gemini-3.5-flash
        provider: google-genai
        tier: T1
        rpd: 20                         # 실측 (docs/benchmarks.md, PerDayPerProjectPerModel)
        # rpm 미실측 — RPD 20이라 분당 한도에 닿기 전에 일일 quota가 먼저 소진된다
        unit-price-in-usd-per-mtok: 0.30   # counterfactual — 2.5 Flash 공시가 proxy (추정)
        unit-price-out-usd-per-mtok: 2.50
      - id: gemini-3.1-flash-lite
        provider: google-genai
        tier: T0
        rpd: 500                        # 실측 (M3-S5, 429 quotaValue PerDayPerProjectPerModel-FreeTier)
        rpm: 15                         # 실측 (M3-S5, 429 quotaValue PerMinutePerProjectPerModel-FreeTier)
        unit-price-in-usd-per-mtok: 0.10   # counterfactual — 2.5 Flash-Lite 공시가 proxy (추정)
        unit-price-out-usd-per-mtok: 0.40
      - id: gemma-4-26b-a4b-it
        provider: google-genai
        tier: T0
        unit-price-in-usd-per-mtok: 0      # 유료 제공 없음 — counterfactual 0
        unit-price-out-usd-per-mtok: 0
      # 가짜 provider (M6 mock, ADR-018 재검토 조건 이행) — 네트워크 0, quota 0. 활성화는 GEMINI_MODEL=fake-flash-lite.
      # 실측 대체가 아니라 실측이 불가능한 조건(429·503·REJECTED 유발, 부하)을 만드는 장치다. 결과는 캐시에 적재되지 않는다.
      - id: fake-flash-lite
        provider: fake
        tier: T0
        unit-price-in-usd-per-mtok: 0
        unit-price-out-usd-per-mtok: 0
      - id: fake-flash                      # 승격(REJECTED→상위) 데모용 상위 모델: TIER_UP_MODEL=fake-flash
        provider: fake
        tier: T1
        unit-price-in-usd-per-mtok: 0
        unit-price-out-usd-per-mtok: 0
    # 가짜 provider 손잡이 (sjw.llm.fake.*, FakeLlmProperties). 비우면 지연 100ms·quota 무제한·장애 0.
    fake:
      latency-ms: ${FAKE_LATENCY_MS:100}
      jitter-ms: ${FAKE_JITTER_MS:0}
      rpm: ${FAKE_RPM:}                     # 분당 한도 → 초과 시 429 PerMinute (실측 형식의 본문)
      rpd: ${FAKE_RPD:}                     # 일일 한도 → 429 PerDay
      error-rate: ${FAKE_ERROR_RATE:0}      # 503 overloaded 주입 확률
      drop-name-rate: ${FAKE_DROP_NAME_RATE:0}   # 확정 인명 1건 누락 확률 → 게이트 REJECTED → 승격 경로
      seed: ${FAKE_SEED:}
  quality:
    # §5.4 런타임 게이트의 상향 라우팅. 게이트 오탐률은 골든셋 전문가 번역으로 선측정되어 있다
    # (QualityGateGoldensetTest → docs/benchmarks.md) — 측정 없이 켜지 않는다는 원칙의 이행.
    tier-up-enabled: ${TIER_UP_ENABLED:true}
    tier-up-model: ${TIER_UP_MODEL:gemini-3.5-flash}   # T1. RPD 20 — REJECTED에만 소비
  # 적응형 rate control (ADR-017). 이 값들은 '운영 rate'가 아니라 탐색의 경계·속도다 —
  # 실제 RPM은 429 피드백으로 스스로 정해진다. 시작값이 틀린 것은 설계상 허용된다.
  #
  # M4-S1 이후: **모델의 rpm이 위 레지스트리에 실측돼 있으면 그 값이 시작점·상한을 대체한다.**
  # 버킷은 모델별인데 탐색 경계가 전역 상수 하나였던 것이 문제였다 — 실측 15인 모델도 20에서
  # 출발해 기동마다 429를 한 번 사서 배웠다. 아래 값은 **미실측 모델의 탐색 기본값**이다.
  rate:
    initial-rpm: 20             # 미실측 모델의 탐색 시작점
    min-rpm: 2                  # 429가 계속돼도 여기까지만 내려간다 (실측이 이보다 낮아도 하한이 이긴다)
    max-rpm: 60                 # 미실측 모델의 탐색 상한
    burst-seconds: 10           # 버킷 용량 = 10초치 발행량 (rpm*10/60, 최소 1)
    decrease-factor: 0.5        # 429 1회 → rate 절반 (AIMD의 MD)
    successes-to-increase: 5    # 연속 5회 성공 → +1 RPM (AIMD의 AI)
    increase-step: 1
    max-wait-ms: 120000         # permit 대기 상한. 넘으면 미ACK 재전달로 큐가 백오프를 흡수
  prompt:
    # M3.5-S2 프롬프트 교체 축 (ADR-013). 템플릿·패턴 파일 위치 — classpath: 또는 file:.
    # 버전(prompt_version)은 위치가 아니라 바이트 체크섬에서 파생되므로 변형을 file:로 띄우면
    # 저절로 다른 버전이 되고 L1/L2 캐시 키도 갈린다. 생산 기본값은 classpath 리소스.
    #   PROMPT_TEMPLATE=file:/eval/prompts/v1-no-persona.st   (compose는 ../eval을 /eval에 마운트)
    template: ${PROMPT_TEMPLATE:classpath:prompts/translate-main.st}
    patterns: ${PROMPT_PATTERNS:classpath:prompts/positive-patterns.tsv}
  cache:
    # M3 L1 캐시 (ADR-009). 키에는 kb_version·prompt_version·ner_version이 들어가므로
    # 인물 사전 교체·프롬프트 개정·NER 재학습은 저절로 무효화된다 (체크섬 파생).
    # epoch는 그 자동화가 닿지 않는 축, 곧 번역 LLM 교체용 수동 손잡이다 — 모델을 갈아끼우고
    # 캐시를 전면 재구축하려면 이 값을 올린다.
    epoch: ${CACHE_EPOCH:1}
    l1:
      enabled: ${CACHE_L1_ENABLED:true}
      ttl-days: 30      # 정확성 장치가 아니라 메모리 위생 — 옛 버전 고아 엔트리 회수용
    l2:
      # 템플릿 슬롯 캐시 (M3-S3). **기본 off, 명시 opt-in** — 품질을 깎아 비용을 버는 기능이므로
      # 기본값이 되어선 안 된다(계획서 §10 M3). §5.4 비열등 임계(chrF −2.0, 확정 인명 재현율
      # 하락 0)를 M3-S5에서 통과해야 켠다. 히트 결과의 등급은 항상 DEGRADED(ADR-009).
      # 꺼져 있어도 job.template_hash는 기록된다 — S4 히트율 시뮬레이션의 입력이다.
      enabled: ${CACHE_L2_ENABLED:false}
      ttl-days: 30
  routing:
    # M4 NER 비용 라우팅 (§5.1, ADR-010). **기본 off, 명시 opt-in** — 어느 모델이 번역하는지
    # 바꾸는 기능이므로 M4 수용 기준(on/off 비용·품질 곡선)을 통과해야 켠다.
    #
    # 티어는 난이도 축이고 모델 배정은 quota 축이다. 실측(M4-S1, 전수 62,056문장):
    #   T0 13.02% / T1 85.15% / T2 1.83%  ← T2만 상위 모델을 노린다
    # 계획서 원안(T2 = MISS 또는 모호)은 T2가 29.86%가 되어 상위 모델 quota(RPD 20 = 전체의 3.8%)를
    # 8배 초과했다. 그렇게 켜면 완역이 124일 → 926일로 늘어난다. MISS를 T2에서 뺀 근거는
    # quota만이 아니다 — 역색인에 없는 인물은 모델을 올려도 알게 되지 않는다.
    enabled: ${ROUTING_ENABLED:false}
    upper-model: ${ROUTING_UPPER_MODEL:gemini-3.5-flash}   # RPD 20 실측 — 희소 자원이다
  ner:
    url: ${NER_URL:http://localhost:8100}
    mode: ${NER_MODE:http}   # http(ONNX 서버, 운영) | rule(규칙 축소판 — degrade/A/B)
  kb:
    mode: ${KB_MODE:file}   # file(왕대별 데이터) | noop(무주입 대조군·degrade)
    dir: ${KB_DIR:../kb}
    name: ${KB_NAME:injo}   # id_lookup_{name}.json / inverted_index_{name}.json — injo, jeongjo 커밋됨
    # version은 설정이 아니다 — 데이터 파일 체크섬에서 파생된다 (M3 캐시 무효화의 신뢰 근거)

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
